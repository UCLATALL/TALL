papers:
  - name: <span style="color:red">The Role of Prior Knowledge in Effects of Embodied Pedagogies on Learning</span>
    authors: Icy Zhang, Alice Xu, Craig Enders, Ji Y. Son, & James W. Stigler
    year: 2025
    filename: Zhang-Preprint.pdf
    abstract: Embodied learning pedagogies are increasingly popular, but our understanding of how embodied pedagogies enhance learning of complex concepts in higher education over longer periods of time remains nascent, particularly how learners’ prior knowledge might interact with different types of embodied pedagogies. We propose the Performing First Hypothesis as an organizing framework, which posits that learners with lower prior knowledge, because they lack the foundational understanding needed to make sense of abstract representations, will benefit from actively performing actions. In contrast, learners who have higher prior knowledge will learn better from observing the actions as it enables more opportunity for connection-making and transfer. We implemented and compared two types of embodied pedagogy(1) perform, in which students actively participated in hands-on activities, and (2) observe, in which students observed others doing hands-on activities. The activities were implemented as the lab component of a 10-week college-level introductory statistics course. 227 college students paired up and participated in the study. One half of the pair was randomly assigned to the Perform condition, where they themselves did the hands-on activities, and the other half was assigned to the Observe condition, where they observed their partner performing those activities.An analysis of students’ midterm and final exam scores showed a significant interaction between prior knowledge and type of pedagogy in the hypothesized direction. Interestingly, only self-rated prior knowledge—not other factors such as math anxiety or how well they had performed in math in previous classes—significantly moderated the effectiveness of the embodied pedagogies. Multilevel analysis of weekly tests supported the exam findings, demonstrating that low-prior-knowledge learners benefited more from physically performing the activities, whereas high-prior-knowledge learners benefited more from observing the activities. The findings support the Performing First Hypothesis, suggest new directions for research on the mechanisms and applications of embodied pedagogies in complex learning environments, and inform real-world educational practices.
  
  - name: <span style="color:red">Empowering novice programmers - Redesigning documentation for effective informal learning.</span>
    authors: Icy Zhang, Yunqi Jia, Xiaoxuan (Alicia) Cheng, Ji Y. Son, & James W. Stigler
    year: 2025
    filename: Empowering novice programmers.pdf
    abstract: Although programming is often learned through formal instruction or self-paced tutorials, informal learning, for example, through publicly available online documentation, is also a significant resource for skill development among novices. However, many novices struggle to extract useful information from documentation. This work aims to answer two key questions - (1) What specific elements of documentation make it difficult for novice learners? (2) What are some design features that could enhance the effectiveness of documentation for novices? Study 1 aims to qualitatively explore the impact of three hypothesized design changes on novice programmers’ learning experience - moving examples to the top of the documentation, ordering examples in increasing argument complexity, and displaying example outputs next to example codes. We propose these design changes should facilitate novices’ learning from the documentation, enhancing its accessibility and effectiveness. Studies 2 and 3 evaluate the effectiveness of the redesigned documentation on novices’ learning outcomes through a quantitative method. Our results demonstrate that these design changes help novices navigate and apply documentation more effectively. 

  - name: <span style="color:red">Watching videos of a drawing hand improves students’ understanding of the normal probability distribution.</span>
    authors: Icy Zhang, Xiaohan Hanna Guo, Ji Y. Son, Idan A. Blank, & James W. Stigler
    year: 2025
    filename: Zhang-Memory & Cognition.pdf
    abstract: Understanding normal probability distributions is a crucial objective in mathematics and statistics education. Drawing upon cognitive psychology research, this study explores the use of drawings and visualizations as effective scaffolds to enhance students' comprehension. Although much research has documented the helpfulness of drawing as a research tool to reveal students’ knowledge states, its direct utility in advancing higher-order cognitive processes remains understudied. In Study 1, qualitative methods were utilized to identify common misunderstandings among students regarding canonical depictions of the normal probability distribution. Building on these insights, Study 2 experimentally compared three instructional videos (static slides, dynamic drawing, and dynamic drawings done by a visible hand). The hand drawing video led to better learning than the other versions. Study 3 examined whether the benefits from observing a hand drawing could be reproduced by a dynamic cursor moving around otherwise static slides (without the presence of a hand). Results showed no significant learning difference between observing a hand drawing and a moving cursor, both outperforming a control. This research links the cognitive process of drawing with its educational role and provides insights into its potential to enhance memory, cognition, and inform instructional methods.

  - name: <span style="color:red">How does expectancy-value-cost motivation vary during a semester? An intensive longitudinal study to explore individual and situational sources of variation in statistics motivation</span>
    authors: Claudia C. Sutter, Delaram A. Totonchi, Jamie DeCoster, Kenneth E. Barron & Chris S. Hulleman
    year: 2024
    filename: sutter-et-al-2024-pulse-checks.pdf
    abstract: We measured expectancy, value, and cost 10 times over a 10-week introductory statistics course (N = 219) to examine their overall trajectory as well as individual (between-student) differences and situational (within-student) variability. First, our findings revealed an initial decline in expectancy and value and an initial increase in cost. Second, expectancy, utility value, and cost demonstrated individual and situational variability of comparable size, while intrinsic value had higher individual variability. Third, individual and situational variability in expectancy and value predicted variability in performance. Lastly, the relation of situational variability in expectancy and utility value with performance was stronger for Black, Latinx, and other racially marginalized students than for White/Asian students. Our findings provide empirical evidence for the situational nature of motivational beliefs and have implications for practitioners, course curriculum designers, and policymakers who aim to create more supportive and motivation-enhancing environments, particularly for statistics courses and students from racially marginalized and underserved backgrounds.

  - name: <span style="color:red">Memorization and Performance During Pandemic Remote Instruction - Evidence of Shifts from an Interactive Textbook</span>
    authors: Jose L. Salas, Xinran (Wendy) Wang, Mary C. Tucker, & Ji. Y. Son
    year: 2024
    filename: Memorization-and-Performance.pdf
    abstract: Students believe mathematics is best learned by memorization; however, endorsing memorization as a study strategy is associated with a decrease in learning (Schoenfeld, 1989). When the world changed with the onset of the COVID-19 global pandemic, instruction transitioned to fully remote instruction where many assignments and examinations became open textbook, open note, and even open Internet. In this new world, did students change their beliefs about the role of memorization in learning? Did academic performance change? And did the relationship between memorization beliefs and academic performance change? The current study takes advantage of data collected in an online interactive statistics textbook used by courses before (in-person) and after (remote) the declaration of the COVID-19 pandemic at three institutions, each representing a part of the California Master Plan for Higher Education (e.g., University of California, California State University, and California Community Colleges). Results from 2668 students who used the textbook showed that the UC institution had lower memorization belief scores compared to both the CSU and CCC institutions. Even when controlling for institution and chapter of the textbook, lower memorization belief scores were related to higher performance. Surprisingly, there were no significant differences in either memorization beliefs nor performance before and after transitioning to online remote instruction due to the pandemic. Although much of educational research is conducted in one institution, this kind of research can identify differences across institutional contexts to understand how learning can be affected by different teaching formats, including in-person and online/distance, brought on by disruptive social changes such as a global pandemic.

  - name: <span style="color:red">The “Better Book” Approach to Addressing Equity in Statistics &colon; Centering the Motivational Experiences of Students from Racially Marginalized Backgrounds for Widespread Benefit</span>
    authors: Claudia C. Sutter, Matthew C. Jackson, Karen B. Givvin, James W. Stigler & Ji Y. Son 
    year: 2024
    filename: sutter-et-al-2024-equity.pdf
    abstract: Although improving racial equity in critical college courses such as introductory statistics is a laudable goal, making research-based progress toward that aim in a scalable manner remains a chal- lenge. To translate psychological insights to benefit racially marginalized students, we implemented the “Better Book” approach, where instructors, researchers, and developers work together to improve an online textbook used in introductory statistics. The “Better Book” approach to equity assumes that racially marginalized students are a “canary in the coal mine”, alerting us to systemic issues that can affect a broader array of students. We started by finding places in the textbook where racially marginalized students reported higher perceptions of costs (the effort and time required to learn the content) than non-marginalized students. Then we drew upon suggestions from users to redesign the textbook where gaps in cost perceptions peaked. We then analyzed data from both the original and redesigned versions of the textbook to evaluate the impact on students who were subsequently enrolled in the course. Results showed that perceptions of cost were dramatically reduced in the experience of racially marginalized students but also the redesign resulted in an improved experience for all students.

  - name: <span style="color:red">Watching videos of a drawing hand improves students’ understanding of the normal probability distribution</span>
    authors: Icy (Yunyi) Zhang, Xiaohan Hanna Guo, Ji Y. Son, Idan A. Blank & James W. Stigler 
    year: 2024
    filename: Watching videos of a drawing hand.pdf
    abstract: Understanding normal probability distributions is a crucial objective in mathematics and statistics education. Drawing upon cognitive psychology research, this study explores the use of drawings and visualizations as effective scaffolds to enhance students' comprehension in a sequence of three studies.

  - name: <span style="color:red"> Embodying Similarity and Difference - The Effect of Listing and Contrasting Gestures During U.S. Political Speech</span>
    authors: Icy (Yunyi) Zhang, Tina Izad, Erica A. Cartmill
    year: 2024
    filename: embodying-similarity.pdf
    abstract: Study 1 examined two rhetorical devices—contrasts and lists—used by three politicians during U.S. presidential debates and asked whether the gestures produced during contrasts and lists differ. Gestures produced during contrasts were more likely to involve changes in hand location, and gestures produced during lists were more likely to involve changes in trajectory. Study 2 used footage from the same debates in an experiment to ask whether gesture influenced the way people perceived the politicians’ arguments.
    
  - name: <span style="color:red">Prediction versus Production for Teaching Computer Programming</span>
    authors: Mary C. Tucker, Xinran (Wendy) Wang, Ji Y. Son, & James W. Stigler 
    year: 2024
    filename: predictionversusproduction.pdf
    abstract: "Background: Most students struggle when learning to program. Aims: In this paper we examine two instructional tasks that can be used to introduce programming: tell-and- practice (the typical pedagogical routine of describing some code or function then having students write code to practice what they have learned) and prediction (where students are given code and asked to make predictions about the output before they are told how the code works). Sample: Participants were 121 college students with no coding experience. Methods: Participants were randomly assigned to one of two parallel training tasks: predict, or tell-and-practice. Results: Participants in the predict condition showed greater learning and better non-cognitive outcomes than those in the tell-and-practice condition. Conclusions: These findings raise a number of questions about the relationship between programming tasks and students’ experiences and outcomes in the early stages of learning programming. They also suggest some pedagogical changes to consider, especially in early introductions to programming."
 
  - name: <span style="color:red"> Latine Students’ Motivational and Emotional Experiences Related to Their Introductory Statistics Course - Differences by Institution Type Necessitate Tailored Interventions</span>
    authors: Claudia C. Sutter, Karen B. Givvin, Paige L. Solomon, & Ana Leandro-Ramos
    year: 2024
    filename: sutter-et-al-2024-latine-students.pdf
    abstract: The present study developed a representation-mapping intervention designed to help students interpret, coordinate, and eventually translate across multiple representations. We integrated the intervention into an online textbook being used in a college course, allowing us to study its impact in a real course over an extended period of time. The findings of this study support the efficacy of the representation-mapping intervention for facilitating learning and shed light on how to implement and refine such interventions in authentic learning contexts.


  - name: <span style="color:red">Concerns and Challenges in Introductory Statistics and Correlates with Motivation and Interest</span>
    authors: Claudia C. Sutter, Karen B. Givvin, & Chris S. Hulleman
    year: 2023
    filename: Sutter, Givvin, Hulleman, 2023.pdf
    abstract: We explore how students’ course concerns at the outset of their introductory statistics course predict their later perceived course challenges and future interest in statistics via a function of achievement motivation. Data were collected from undergraduate students (N1=4524; 70% female; 37.8% students from racially marginalized groups) during the COVID-19 pandemic, using both open-ended (concerns and challenges) and closed-ended (achievement motivation and future interest) questions. Overall, incoming course concerns positively predicted perceived costs during the course and challenges at the end of the course and negatively predicted success expectancy and utility value during the course and future interest in statistics at the end of the course. Patterns varied by individual concerns/challenges, gender, and race/ethnicity. Cost played an important mediating role for female students and students from racially marginalized groups (e.g., Black, Latinx, or Native American/Indigenous students) between course concerns and future interest in statistics. Our findings (a) add to the increasing body of research reporting differences in how female and male students as well as students from racially marginalized backgrounds and racial majority students experience STEM courses and help explain different levels of interest in pursuing STEM careers, and (b) suggest that increasing future interest in statistics might require different interventions.
      
  - name: <span style="color:red">Representational-Mapping Strategies Improve Learning From an Online Statistics Textbook</span>
    authors: Icy (Yunyi) Zhang, Maureen E. Gray, Alicia (Xiaoxuan) Cheng, Ji Y. Son, & James W. Stigler
    year: 2023
    filename: representation-mapping.pdf
    abstract: The present study developed a representation-mapping intervention designed to help students interpret, coordinate, and eventually translate across multiple representations. We integrated the intervention into an online textbook being used in a college course, allowing us to study its impact in a real course over an extended period of time. The findings of this study support the efficacy of the representation-mapping intervention for facilitating learning and shed light on how to implement and refine such interventions in authentic learning contexts.
    
  - name: <span style="color:red">Listening for Common Ground in High School and Early Collegiate Mathematics</span>
    authors: Gail Burrill, Henry Cohn, Yvonne Lai, Dev P. Sinha, Ji Y. Son, & Katherine F. Stevenson
    year: 2023
    filename: Burrill 2023 Common Ground.pdf
    abstract: Solutions to pressing and complex social challenges require that we reach for common ground. Only through cooperation among people with a broad range of backgrounds and expertise can progress be made on issues as challenging as improving student success in mathematics. In this spirit, the AMS Committee on Education held a forum in May 2022 entitled The Evolving Curriculum in High School and Early Undergraduate Mathematical Sciences Education. This article is a report on that forum by the authors listed above, who were among the organizers and presenters.

